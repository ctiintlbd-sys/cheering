# Codemagic CI/CD — Cheering (with Shorebird)
definitions:
  env_versions: &env_versions
    flutter: 3.44.7   # Codemagic e na pele "stable" dao
    xcode: latest
    cocoapods: default
  app_vars: &app_vars
    APP_ID: com.ctibd.cheering
    PACKAGE_NAME: com.ctibd.cheering
    APP_STORE_APPLE_ID: 6821031458
  scripts:
    - &install_deps
      name: Install Flutter dependencies
      script: |
        set -e
        flutter config --no-enable-swift-package-manager
        flutter pub get
    - &install_shorebird
      name: Install Shorebird
      script: |
        set -e
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        $HOME/.shorebird/bin/shorebird --version
    - &ios_signing_setup
      name: Set up iOS code signing
      script: |
        set -e
        keychain initialize
        xcode-project use-profiles
  publishing_email: &publishing_email
    email:
      recipients:
        - ikramulhasantanvir@gmail.com
      notify:
        success: false
        failure: true

workflows:
  # ---------- iOS: main e push -> Shorebird release -> TestFlight ----------
  ios-testflight:
    name: iOS TestFlight (Shorebird release)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: "Codemagic Key"
    environment:
      <<: *env_versions
      groups:
        - shorebird          # SHOREBIRD_TOKEN (secure)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctibd.cheering
      vars:
        <<: *app_vars
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *install_deps
      - *install_shorebird
      - *ios_signing_setup
      - name: Shorebird release iOS
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          shorebird release ios \
            --export-options-plist=/Users/builder/export_options.plist \
            -- --build-number=$((LATEST + 1))
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      <<: *publishing_email
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------- Android: main e push -> Shorebird release -> AAB ----------
  android-release:
    name: Android Release (Shorebird release)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *env_versions
      groups:
        - shorebird
      android_signing:
        - keystore_reference
      vars:
        <<: *app_vars
        BUILD_NUMBER_OFFSET: 0   # Play te age bundle thakle boro number dao, jemon 100
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *install_deps
      - *install_shorebird
      - name: Shorebird release Android
        script: |
          set -e
          shorebird release android --artifact aab \
            -- --build-number=$((PROJECT_BUILD_NUMBER + BUILD_NUMBER_OFFSET))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      <<: *publishing_email

  # ---------- Patch: manual (Codemagic UI theke Start new build) ----------
  shorebird-patch:
    name: Shorebird Patch
    instance_type: mac_mini_m2   # iOS patch er jonno Mac lagbe
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Key"
    environment:
      <<: *env_versions
      groups:
        - shorebird
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctibd.cheering
      android_signing:
        - keystore_reference
      vars:
        <<: *app_vars
        IOS_RELEASE_VERSION: latest       # exact dite chaile jemon 1.0.0+12
        ANDROID_RELEASE_VERSION: latest   # exact dite chaile jemon 1.0.0+5
    # triggering nai: shudhu manually chalbe
    scripts:
      - *install_deps
      - *install_shorebird
      - *ios_signing_setup
      - name: Patch iOS and Android
        script: |
          set -e
          shorebird patch ios --release-version="$IOS_RELEASE_VERSION" \
            --export-options-plist=/Users/builder/export_options.plist
          shorebird patch android --release-version="$ANDROID_RELEASE_VERSION"
    publishing:
      <<: *publishing_email