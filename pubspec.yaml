name: cheering
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^9.2.1
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  go_router: ^17.3.0
  dio: ^5.8.0+1
  internet_connection_checker_plus: ^3.1.1
  dio_cache_interceptor: ^4.0.7
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  lottie: ^3.5.1
  cached_network_image: ^3.4.1
  shimmer: ^4.0.0
  pinput: ^6.0.2
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  image_cropper: ^12.2.1
  file_picker: ^12.0.0
  image_picker: ^1.2.3
  equatable: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  bloc_concurrency: ^0.3.0
  flutter_slidable: ^4.0.3
  photo_view: ^0.15.0
  flutter_web_auth_2: ^5.1.0
  local_auth: ^3.0.2
  asn1lib: ^1.6.5
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: null
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/core/utils/assets/
  line_length: 80
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true
    lottie: true
    #===========>>>>>>>>>> Flutter Gen Code ==============>>>>>>>>>>>
    # dart pub global activate flutter_gen
    # flutter pub run build_runner build --delete-conflicting-outputs
#    dart run build_runner build


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

#  fvm flutter pub get
#  fvm dart run flutter_launcher_icons
#  fvm flutter clean
#  fvm flutter run


flutter:
  generate: true
  config:
    enable-swift-package-manager: false
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/

  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf


